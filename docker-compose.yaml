services:
  api-db:
    container_name: api_db
    image: postgres:16
    environment:
      - POSTGRES_USER=jrdev
      - POSTGRES_DB=api_db
      - POSTGRES_PASSWORD=mypass123456
    ports:
      - 5433:5432
    networks:
      - local-network

  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api-db
    ports:
      - "5200:5200"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      AppConfig__Port: 5200
      AppConfig__Service: Api
      AppConfig__Status: Running
      AppConfig__ConnectionString: "Host=api-db;Port=5432;Database=api_db;Username=jrdev;Password=mypass123456"
      AppConfig__SubscriptionPrice: 990
    networks:
      - local-network

networks:
  local-network:
    name: local-network
    external: true